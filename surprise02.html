<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💖 Surprise 02 - Conversation 💖</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Lucida Handwriting', cursive;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 220, 240, 0.22)),
    url('Images/Petite.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  text-align: center;
  padding: 120px 25px 50px;
  color: #2765F5;
  overflow-x: hidden;
}

/* 🌈 BANDEAU NAVIGATION */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  z-index: 1000;
  backdrop-filter: blur(8px);
}

.navbar a {
  text-decoration: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 12px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.25);
  transition: 0.25s;
}

.navbar a:hover {
  background: white;
  color: #ff6b6b;
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* ✨ Fond animé */
.sparkles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.sparkle {
  position: absolute;
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 12px white, 0 0 25px #ff6bcb;
  animation: floatSparkle 7s linear infinite;
  opacity: 0.8;
}

.sparkle:nth-child(1) { left: 10%; animation-delay: 0s; }
.sparkle:nth-child(2) { left: 25%; animation-delay: 1.1s; }
.sparkle:nth-child(3) { left: 42%; animation-delay: 2.3s; }
.sparkle:nth-child(4) { left: 63%; animation-delay: 0.7s; }
.sparkle:nth-child(5) { left: 82%; animation-delay: 1.9s; }
.sparkle:nth-child(6) { left: 94%; animation-delay: 3s; }

@keyframes floatSparkle {
  0% {
    top: 110%;
    transform: scale(0.3) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    top: -10%;
    transform: scale(1.5) rotate(360deg);
    opacity: 0;
  }
}

/* 🧊 Wrapper principal */
.page-wrapper {
  position: relative;
  z-index: 2;
  max-width: 950px;
  margin: auto;
  padding: 3px;
  border-radius: 35px;
  background: linear-gradient(135deg, #ff6bcb, #ffd166, #6ecbff, #a1c4fd);
  box-shadow:
    0 0 30px rgba(255, 107, 203, 0.65),
    0 20px 60px rgba(0,0,0,0.35);
  animation: appearBig 0.9s ease both;
}

.main-card {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 32px;
  padding: 35px;
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}

.main-card::before {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(255,107,203,0.35), transparent 70%);
  top: -110px;
  right: -90px;
  animation: pulseGlow 3s infinite alternate;
}

.main-card::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(110,203,255,0.35), transparent 70%);
  bottom: -110px;
  left: -90px;
  animation: pulseGlow 3s infinite alternate-reverse;
}

.content {
  position: relative;
  z-index: 3;
}

@keyframes appearBig {
  from {
    opacity: 0;
    transform: translateY(45px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes pulseGlow {
  from {
    transform: scale(0.9);
    opacity: 0.5;
  }
  to {
    transform: scale(1.25);
    opacity: 1;
  }
}

h1 {
  margin-top: 0;
  font-size: 38px;
  color: #ff4b8b;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}

.subtitle {
  color: #2765F5;
  font-size: 17px;
  margin-bottom: 25px;
}

/* 🔐 Box code */
.code-box {
  max-width: 620px;
  margin: 0 auto 35px;
  padding: 25px;
  border-radius: 28px;
  background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,238,246,0.96));
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  animation: softPop 0.8s ease both;
}

.code-box p {
  margin-top: 0;
  font-size: 17px;
  color: #2765F5;
}

.input-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

input {
  width: min(100%, 330px);
  padding: 15px 18px;
  font-size: 17px;
  font-family: 'Lucida Handwriting', cursive;
  border: 2px solid rgba(255,75,139,0.25);
  border-radius: 999px;
  outline: none;
  color: #2765F5;
  background: rgba(255,255,255,0.95);
  box-shadow: inset 0 0 12px rgba(255,107,203,0.12);
  transition: 0.25s;
}

input:focus {
  border-color: #ff4b8b;
  box-shadow:
    0 0 0 5px rgba(255,75,139,0.12),
    inset 0 0 12px rgba(255,107,203,0.15);
  transform: scale(1.02);
}

button {
  padding: 15px 23px;
  font-size: 16px;
  font-family: 'Lucida Handwriting', cursive;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff6b6b, #ff4b8b);
  color: white;
  cursor: pointer;
  box-shadow: 0 12px 25px rgba(255,75,139,0.35);
  transition: 0.25s;
}

button:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 18px 35px rgba(255,75,139,0.55);
}

.error-message {
  margin-top: 16px;
  color: #ff4b4b;
  font-size: 15px;
  min-height: 22px;
}

@keyframes softPop {
  from {
    opacity: 0;
    transform: translateY(25px) scale(0.96);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

/* 📱 Téléphone */
.phone {
  width: min(100%, 430px);
  margin: 0 auto;
  border-radius: 38px;
  padding: 14px;
  background: linear-gradient(145deg, #111, #363636);
  box-shadow:
    0 22px 45px rgba(0,0,0,0.42),
    inset 0 0 18px rgba(255,255,255,0.08);
  display: none;
  animation: phoneReveal 0.9s ease both;
}

@keyframes phoneReveal {
  from {
    opacity: 0;
    transform: translateY(50px) scale(0.88) rotate(-2deg);
    filter: blur(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0);
    filter: blur(0);
  }
}

.phone-screen {
  background:
    linear-gradient(rgba(255,255,255,0.82), rgba(255,245,250,0.82)),
    url('Images/Petite.png');
  background-size: cover;
  background-position: center;
  border-radius: 28px;
  overflow: hidden;
  min-height: 620px;
  max-height: 620px;
  display: flex;
  flex-direction: column;
}

/* Header WhatsApp-like */
.chat-header {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: white;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.18);
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff4b8b, #6ecbff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 14px rgba(255,255,255,0.6);
}

.chat-title {
  text-align: left;
}

.chat-title strong {
  display: block;
  font-size: 15px;
}

.chat-title span {
  display: block;
  font-size: 12px;
  opacity: 0.9;
}

/* Zone messages */
.chat-body {
  flex: 1;
  padding: 18px 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

/* Bubbles */
.message {
  max-width: 78%;
  padding: 12px 14px 18px;
  border-radius: 20px;
  position: relative;
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.35;
  text-align: left;
  box-shadow: 0 8px 18px rgba(0,0,0,0.14);
  animation: messageIn 0.45s ease both;
  word-wrap: break-word;
}

.message.me {
  align-self: flex-end;
  background: linear-gradient(135deg, #a8ff78, #78ffd6);
  color: #174a36;
  border-bottom-right-radius: 5px;
}

.message.her {
  align-self: flex-start;
  background: linear-gradient(135deg, #ffb6d9, #ffd1ec);
  color: #6b1744;
  border-bottom-left-radius: 5px;
}

.message-name {
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 4px;
  opacity: 0.75;
}

.message-time {
  position: absolute;
  right: 12px;
  bottom: 5px;
  font-size: 10px;
  opacity: 0.55;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.88);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

/* Typing */
.typing-bubble {
  align-self: flex-start;
  background: rgba(255, 209, 236, 0.95);
  border-radius: 20px;
  border-bottom-left-radius: 5px;
  padding: 15px 18px;
  width: 76px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.14);
  animation: messageIn 0.35s ease both;
}

.typing-bubble.me-typing {
  align-self: flex-end;
  background: rgba(168, 255, 120, 0.95);
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 5px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.dots span {
  width: 8px;
  height: 8px;
  background: rgba(0,0,0,0.35);
  border-radius: 50%;
  animation: typingDots 1s infinite ease-in-out;
}

.dots span:nth-child(2) {
  animation-delay: 0.15s;
}

.dots span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes typingDots {
  0%, 80%, 100% {
    transform: translateY(0);
    opacity: 0.35;
  }
  40% {
    transform: translateY(-7px);
    opacity: 1;
  }
}

/* Footer */
.chat-footer {
  padding: 12px;
  background: rgba(255,255,255,0.68);
  display: flex;
  align-items: center;
  gap: 8px;
}

.fake-input {
  flex: 1;
  padding: 12px 14px;
  border-radius: 999px;
  background: white;
  color: rgba(0,0,0,0.35);
  font-family: Arial, sans-serif;
  font-size: 13px;
  text-align: left;
}

.send-dot {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff6b6b, #ff4b8b);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px rgba(255,75,139,0.35);
}

/* Badge date */
.conversation-date {
  align-self: center;
  background: rgba(255,255,255,0.85);
  color: #2765F5;
  padding: 8px 13px;
  border-radius: 999px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  box-shadow: 0 5px 13px rgba(0,0,0,0.12);
  margin-bottom: 5px;
  animation: messageIn 0.45s ease both;
}

/* 📱 Responsive */
@media (max-width: 700px) {
  body {
    padding: 110px 14px 35px;
  }

  .navbar {
    height: auto;
    padding: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .navbar a {
    font-size: 13px;
    padding: 9px 12px;
  }

  .main-card {
    padding: 24px 15px;
  }

  h1 {
    font-size: 28px;
  }

  .phone-screen {
    min-height: 560px;
    max-height: 560px;
  }

  .message {
    max-width: 84%;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">🎁 Accueil</a>
  <a href="surprise01.html">✨ Surprise 01</a>
  <a href="surprise02.html">💖 Surprise 02</a>
  <a href="surprise03.html">🌙 Surprise 03</a>
  <a href="surprise04.html">🔥 Surprise 04</a>
</nav>

<div class="sparkles">
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
</div>

<div class="page-wrapper">
  <div class="main-card">
    <div class="content">

      <h1>💬 Conversation secrète 💬</h1>
      <p class="subtitle">Entre un code pour faire réapparaître une conversation... message après message 😼</p>

      <div class="code-box" id="codeBox">
        <p>Code de conversation</p>

        <div class="input-row">
          <input id="codeInput" placeholder="Ex : CONV01">
          <button onclick="checkConversationCode()">Ouvrir ✨</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
      </div>

      <div class="phone" id="phone">
        <div class="phone-screen">

          <div class="chat-header">
            <div class="avatar">💖</div>
            <div class="chat-title">
              <strong>Conversation secrète</strong>
              <span id="onlineStatus">en ligne</span>
            </div>
          </div>

          <div class="chat-body" id="chatBody"></div>

          <div class="chat-footer">
            <div class="fake-input">Message...</div>
            <div class="send-dot">➤</div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script>
const conversationFiles = {
  "CONV01": {
    date: "Petite virée à 2...✨",
    file: "Conversations/13 novembre.txt"
  },

  "CONV02": {
    date: "La tête ailleurs.. 💫",
    file: "Conversations/14 novembre.txt"
  },

  "CONV03": {
    date: "Encore une autre conversation 😼",
    file: "Conversations/conv03.txt"
  }
};

// 👉 Réglages simples
const me = "Mikakimi";       // Mika apparaît en vert à droite
const her = "Volley Alex";      // Alex apparaît en rose à gauche

let currentConversation = null;
let currentIndex = 0;
let isPlaying = false;

const codeInput = document.getElementById("codeInput");
const errorMessage = document.getElementById("errorMessage");
const phone = document.getElementById("phone");
const chatBody = document.getElementById("chatBody");
const onlineStatus = document.getElementById("onlineStatus");

codeInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    checkConversationCode();
  }
});

async function checkConversationCode() {
  const code = codeInput.value.trim().toUpperCase();

  errorMessage.textContent = "";

  if (!conversationFiles[code]) {
    errorMessage.textContent = "❌ Code inconnu... essaie CONV01 pour tester 🤪";
    shakeCodeBox();
    return;
  }

  if (isPlaying) return;

  const conversationInfo = conversationFiles[code];

  try {
    const response = await fetch(conversationInfo.file);

    if (!response.ok) {
      throw new Error("Fichier introuvable");
    }

    const text = await response.text();
    const messages = parseConversationText(text);

    if (messages.length === 0) {
      throw new Error("Conversation vide ou format incorrect");
    }

currentConversation = {
  date: messages[0].date,
  messages: messages
};

    currentIndex = 0;
    isPlaying = true;

    phone.style.display = "block";
    chatBody.innerHTML = "";
    onlineStatus.textContent = "connexion à la conversation...";

    setTimeout(() => {
      addDateBadge(currentConversation.date);
      playConversation();
    }, 700);

  } catch (error) {
    errorMessage.textContent = "❌ Impossible de charger cette conversation 😭";
    shakeCodeBox();
    console.error(error);
  }
}

function parseConversationText(text) {
  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);

  const messages = [];

  lines.forEach(line => {
    const match = line.match(/^(\d{1,2}\/\d{1,2}\/\d{4}),\s*(\d{1,2}:\d{2})\s*-\s*([^:]+):\s*(.*)$/);

    if (!match) {
      console.warn("Ligne non reconnue :", line);
      return;
    }

    const date = match[1];
    const time = match[2];
    const sender = match[3].trim();
    const messageText = match[4].trim();

    messages.push({
      date: date,
      time: time,
      sender: sender,
      text: messageText
    });
  });

  return messages;
}
  
function playConversation() {
  if (currentIndex >= currentConversation.messages.length) {
    onlineStatus.textContent = "conversation terminée ✨";
    isPlaying = false;
    finalGlow();
    return;
  }

  const message = currentConversation.messages[currentIndex];

  showTyping(message.sender);

  const typingTime = 1500 + Math.random() * 1000;

  setTimeout(() => {
    removeTyping();
    addMessage(message);
    currentIndex++;

    const pauseBetweenMessages = 1100 + Math.random() * 900;

    setTimeout(playConversation, pauseBetweenMessages);
  }, typingTime);
}

function showTyping(sender) {
  onlineStatus.textContent = `${sender} écrit...`;

  const typing = document.createElement("div");
  typing.classList.add("typing-bubble");
  typing.id = "typingBubble";

  if (sender === me) {
    typing.classList.add("me-typing");
  }

  typing.innerHTML = `
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chatBody.appendChild(typing);
  scrollToBottom();
}

function removeTyping() {
  const typing = document.getElementById("typingBubble");

  if (typing) {
    typing.remove();
  }
}


function addMessage(message) {
  const bubble = document.createElement("div");

  bubble.classList.add("message");

  if (message.sender === me) {
    bubble.classList.add("me");
  } else {
    bubble.classList.add("her");
  }

  const displayedText = message.text ? message.text : "…";

  bubble.innerHTML = `
    <div class="message-name">${message.sender}</div>
    <div>${displayedText}</div>
    <div class="message-time">${message.time}</div>
  `;

  chatBody.appendChild(bubble);
  scrollToBottom();
}

function addDateBadge(dateText) {
  const dateBadge = document.createElement("div");
  dateBadge.classList.add("conversation-date");
  dateBadge.textContent = dateText;
  chatBody.appendChild(dateBadge);
  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => {
    chatBody.scrollTop = chatBody.scrollHeight;
  }, 80);
}

function getFakeTime() {
  const now = new Date();
  return now.toLocaleTimeString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function shakeCodeBox() {
  const codeBox = document.getElementById("codeBox");

  codeBox.animate([
    { transform: "translateX(0)" },
    { transform: "translateX(-8px)" },
    { transform: "translateX(8px)" },
    { transform: "translateX(-6px)" },
    { transform: "translateX(6px)" },
    { transform: "translateX(0)" }
  ], {
    duration: 450,
    easing: "ease"
  });
}

function finalGlow() {
  phone.animate([
    {
      filter: "drop-shadow(0 0 0 rgba(255,75,139,0))",
      transform: "scale(1)"
    },
    {
      filter: "drop-shadow(0 0 35px rgba(255,75,139,0.95))",
      transform: "scale(1.03)"
    },
    {
      filter: "drop-shadow(0 0 0 rgba(255,75,139,0))",
      transform: "scale(1)"
    }
  ], {
    duration: 1200,
    easing: "ease"
  });
}
</script>
