<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>✨ Surprise 01 - Quiz ✨</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Lucida Handwriting', cursive;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 220, 240, 0.25)),
    url('Images/Petite.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  text-align: center;
  padding: 120px 30px 50px;
  color: #2765F5;
  overflow-x: hidden;
}

/* 🌈 BANDEAU NAVIGATION */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  z-index: 1000;
  backdrop-filter: blur(8px);
}

.navbar a {
  text-decoration: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 12px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.25);
  transition: 0.25s;
}

.navbar a:hover {
  background: white;
  color: #ff6b6b;
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* ✨ Petites étoiles animées */
.sparkles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.sparkle {
  position: absolute;
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 12px white, 0 0 25px #ff6bcb;
  animation: floatSparkle 7s linear infinite;
  opacity: 0.8;
}

.sparkle:nth-child(1) { left: 10%; animation-delay: 0s; }
.sparkle:nth-child(2) { left: 25%; animation-delay: 1.2s; }
.sparkle:nth-child(3) { left: 45%; animation-delay: 2.4s; }
.sparkle:nth-child(4) { left: 65%; animation-delay: 0.8s; }
.sparkle:nth-child(5) { left: 82%; animation-delay: 1.8s; }
.sparkle:nth-child(6) { left: 93%; animation-delay: 3s; }

@keyframes floatSparkle {
  0% {
    top: 110%;
    transform: scale(0.3) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    top: -10%;
    transform: scale(1.4) rotate(360deg);
    opacity: 0;
  }
}

/* 🧊 Carte principale */
.quiz-wrapper {
  position: relative;
  z-index: 2;
  max-width: 850px;
  margin: auto;
  padding: 3px;
  border-radius: 35px;
  background: linear-gradient(135deg, #ff6bcb, #ffd166, #6ecbff, #a1c4fd);
  box-shadow:
    0 0 30px rgba(255, 107, 203, 0.65),
    0 20px 60px rgba(0,0,0,0.35);
  animation: appearBig 0.9s ease both;
}

.quiz-card {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 32px;
  padding: 35px;
  backdrop-filter: blur(10px);
  min-height: 520px;
  position: relative;
  overflow: hidden;
}

.quiz-card::before {
  content: "";
  position: absolute;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(255,107,203,0.35), transparent 70%);
  top: -90px;
  right: -80px;
  animation: pulseGlow 3s infinite alternate;
}

.quiz-card::after {
  content: "";
  position: absolute;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(110,203,255,0.35), transparent 70%);
  bottom: -90px;
  left: -80px;
  animation: pulseGlow 3s infinite alternate-reverse;
}

@keyframes appearBig {
  from {
    opacity: 0;
    transform: translateY(45px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes pulseGlow {
  from {
    transform: scale(0.9);
    opacity: 0.5;
  }
  to {
    transform: scale(1.25);
    opacity: 1;
  }
}

.quiz-content {
  position: relative;
  z-index: 3;
}

h1 {
  margin-top: 0;
  font-size: 38px;
  color: #ff4b8b;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}

.subtitle {
  color: #2765F5;
  font-size: 17px;
  margin-bottom: 25px;
}

/* 📊 Progression */
.top-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.badge {
  background: linear-gradient(135deg, #ff6b6b, #ff9a9e);
  color: white;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: 0 8px 18px rgba(255,107,107,0.35);
}

.progress-container {
  width: 100%;
  height: 14px;
  background: rgba(39,101,245,0.15);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 28px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ff4b8b, #ffd166, #6ecbff);
  border-radius: 999px;
  transition: width 0.6s ease;
  box-shadow: 0 0 15px rgba(255,75,139,0.8);
}

/* ❓ Question */
.question-box {
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,238,246,0.95));
  padding: 28px;
  border-radius: 25px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.15);
  margin-bottom: 28px;
  animation: questionIn 0.55s ease both;
}

.question {
  font-size: 24px;
  line-height: 1.5;
  color: #2765F5;
}

@keyframes questionIn {
  from {
    opacity: 0;
    transform: translateY(25px) scale(0.96);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

/* 🎯 Réponses */
.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.answer-btn {
  position: relative;
  padding: 20px;
  min-height: 90px;
  font-size: 17px;
  font-family: 'Lucida Handwriting', cursive;
  border: none;
  border-radius: 22px;
  cursor: pointer;
  color: white;
  background: linear-gradient(135deg, #2765F5, #8aa8ff);
  box-shadow: 0 10px 22px rgba(39,101,245,0.35);
  overflow: hidden;
  transition: 0.25s;
  animation: answerPop 0.5s ease both;
}

.answer-btn:nth-child(1) { animation-delay: 0.05s; }
.answer-btn:nth-child(2) { animation-delay: 0.15s; }
.answer-btn:nth-child(3) { animation-delay: 0.25s; }
.answer-btn:nth-child(4) { animation-delay: 0.35s; }

.answer-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  left: -100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
  transition: 0.45s;
}

.answer-btn:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 16px 30px rgba(39,101,245,0.45);
}

.answer-btn:hover::before {
  left: 100%;
}

.answer-letter {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 34px;
  height: 34px;
  margin-right: 8px;
  background: rgba(255,255,255,0.25);
  border-radius: 50%;
  font-weight: bold;
}

@keyframes answerPop {
  from {
    opacity: 0;
    transform: translateY(30px) rotate(-1deg) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotate(0) scale(1);
  }
}

/* Feedback réponse */
.answer-btn.correct {
  background: linear-gradient(135deg, #2ecc71, #a8ff78);
  color: white;
  animation: correctBoom 0.65s ease both;
}

.answer-btn.wrong {
  background: linear-gradient(135deg, #ff4b4b, #ff9a9e);
  color: white;
  animation: wrongShake 0.45s ease both;
}

.answer-btn.disabled {
  pointer-events: none;
  opacity: 0.75;
}

@keyframes correctBoom {
  0% { transform: scale(1); }
  45% { transform: scale(1.12) rotate(1deg); box-shadow: 0 0 35px rgba(46,204,113,0.9); }
  100% { transform: scale(1.03); }
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* 🏆 Score final */
.final-screen {
  animation: finalReveal 1s ease both;
}

.final-score {
  font-size: 72px;
  color: #ff4b8b;
  margin: 20px 0;
  text-shadow:
    0 0 10px white,
    0 0 25px rgba(255,75,139,0.9),
    0 0 45px rgba(255,209,102,0.9);
  animation: scorePulse 1.5s infinite alternate;
}

.final-message {
  font-size: 23px;
  color: #2765F5;
  line-height: 1.6;
  margin-bottom: 30px;
}

@keyframes finalReveal {
  from {
    opacity: 0;
    transform: scale(0.4) rotate(-8deg);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
    filter: blur(0);
  }
}

@keyframes scorePulse {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.08);
  }
}

.restart-btn {
  padding: 16px 28px;
  font-size: 17px;
  font-family: 'Lucida Handwriting', cursive;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff6b6b, #ff4b8b);
  color: white;
  cursor: pointer;
  box-shadow: 0 12px 25px rgba(255,75,139,0.35);
  transition: 0.25s;
}

.restart-btn:hover {
  transform: translateY(-4px) scale(1.06);
  box-shadow: 0 18px 35px rgba(255,75,139,0.55);
}

/* 🎊 Confettis */
.confetti {
  position: fixed;
  top: -15px;
  width: 12px;
  height: 18px;
  border-radius: 4px;
  z-index: 9999;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* 📱 Responsive */
@media (max-width: 700px) {
  body {
    padding: 110px 15px 35px;
  }

  .navbar {
    height: auto;
    padding: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .navbar a {
    font-size: 13px;
    padding: 9px 12px;
  }

  .quiz-card {
    padding: 24px 18px;
  }

  h1 {
    font-size: 28px;
  }

  .question {
    font-size: 19px;
  }

  .answers {
    grid-template-columns: 1fr;
  }

  .final-score {
    font-size: 52px;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">🎁 Accueil</a>
  <a href="surprise01.html">✨ Surprise 01</a>
  <a href="surprise02.html">💖 Surprise 02</a>
  <a href="surprise03.html">🌙 Surprise 03</a>
  <a href="surprise04.html">🔥 Surprise 04</a>
</nav>

<div class="sparkles">
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
</div>

<div class="quiz-wrapper">
  <div class="quiz-card">
    <div class="quiz-content" id="quizContent">

      <h1>✨ Le Quiz Secret ✨</h1>
      <p class="subtitle">3 petites questions... mais attention, chaque réponse compte 😼</p>

      <div class="top-info">
        <div class="badge" id="questionNumber">Question 1 / 3</div>
        <div class="badge" id="scoreBadge">Score : 0</div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="quizZone"></div>

    </div>
  </div>
</div>

<script>
const questions = [
  {
    question: "Devine combien de messages on a pu s'envoyer depuis 7 mois...",
    answers: [
      "environ 500",
      "environ 2000",
      "environ 10000",
      "environ 20000"
    ],
    correct: 3
  },
  {
    question: "Combien de fois on a eu chaud derrière notre tel ?",
    answers: [
      "environ 5",
      "environ 20",
      "environ 100",
      "environ 200"
    ],
    correct: 2
  },
  {
    question: "À quelle date on a commencé à vriller ?",
    answers: [
      "début septembre",
      "début octobre",
      "début novembre",
      "début décembre"
    ],
    correct: 1
  }
];

let currentQuestion = 0;
let score = 0;
let locked = false;

const quizZone = document.getElementById("quizZone");
const questionNumber = document.getElementById("questionNumber");
const scoreBadge = document.getElementById("scoreBadge");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  locked = false;

  const q = questions[currentQuestion];

  questionNumber.textContent = `Question ${currentQuestion + 1} / ${questions.length}`;
  scoreBadge.textContent = `Score : ${score}`;
  progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;

  quizZone.innerHTML = `
    <div class="question-box">
      <div class="question">${q.question}</div>
    </div>

    <div class="answers">
      ${q.answers.map((answer, index) => `
        <button class="answer-btn" onclick="selectAnswer(${index}, this)">
          <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
          ${answer}
        </button>
      `).join("")}
    </div>
  `;
}

function selectAnswer(index, button) {
  if (locked) return;
  locked = true;

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll(".answer-btn");

  buttons.forEach(btn => btn.classList.add("disabled"));

  if (index === q.correct) {
    score++;
    button.classList.add("correct");
    createMiniExplosion(button);
  } else {
    button.classList.add("wrong");
    buttons[q.correct].classList.add("correct");
  }

  scoreBadge.textContent = `Score : ${score}`;

  setTimeout(() => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showFinalScore();
    }
  }, 1300);
}

function showFinalScore() {
  progressBar.style.width = "100%";
  questionNumber.textContent = "Quiz terminé ✨";
  scoreBadge.textContent = `Score : ${score}`;

  let message = "";

  if (score === 3) {
    message = "Score parfait... évidemment 😈 Tu connais beaucoup trop bien cette histoire.";
  } else if (score === 2) {
    message = "Très joli score 😼 Il y a clairement des souvenirs qui chauffent encore.";
  } else if (score === 1) {
    message = "Un petit point sauvé... mais va falloir réviser nos archives 🤪";
  } else {
    message = "0 point... scandale absolu 😭 On recommence, là c'est obligatoire.";
  }

  quizZone.innerHTML = `
    <div class="final-screen">
      <h1>🎊 Résultat final 🎊</h1>
      <div class="final-score">${score} / ${questions.length}</div>
      <div class="final-message">${message}</div>
      <button class="restart-btn" onclick="restartQuiz()">Recommencer le quiz ✨</button>
    </div>
  `;

  launchConfetti();
}

function restartQuiz() {
  currentQuestion = 0;
  score = 0;
  showQuestion();
}

function createMiniExplosion(button) {
  const rect = button.getBoundingClientRect();

  for (let i = 0; i < 12; i++) {
    const star = document.createElement("div");
    star.textContent = "✨";
    star.style.position = "fixed";
    star.style.left = rect.left + rect.width / 2 + "px";
    star.style.top = rect.top + rect.height / 2 + "px";
    star.style.fontSize = "18px";
    star.style.pointerEvents = "none";
    star.style.zIndex = "9999";

    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 60;

    document.body.appendChild(star);

    star.animate([
      {
        transform: "translate(0,0) scale(1)",
        opacity: 1
      },
      {
        transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`,
        opacity: 0
      }
    ], {
      duration: 850,
      easing: "ease-out"
    });

    setTimeout(() => star.remove(), 900);
  }
}

function launchConfetti() {
  const colors = ["#ff4b8b", "#ffd166", "#6ecbff", "#a1c4fd", "#ff9a9e", "#ffffff"];

  for (let i = 0; i < 90; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 0.8 + "s";
    confetti.style.animationDuration = 2.4 + Math.random() * 1.8 + "s";
    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 4500);
  }
}

showQuestion();
</script>

</body>
</html>
