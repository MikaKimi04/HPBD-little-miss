// 🔥 CHECK CODE (MODIFIÉ)
function checkCode() {
  const code = document.getElementById("codeInput").value.toUpperCase();
  const result = document.getElementById("result");

  if (!surprises[code]) {
    result.innerHTML = "❌ Code inconnu 🤪";
    return;
  }

  const surprise = surprises[code];

  // 👉 CAS PROUST
  if (surprise.type === "proust") {
    window.proustData = surprise.content;
    window.proustIndex = 0;
    showProust();
    return;
  }

  // 👉 CAS NORMAL (TES SURPRISES)
  let html = `<h2>${surprise.message}</h2>`;

  if (surprise.type === "youtube") {
    html += `<iframe width="450" height="255"
      src="https://www.youtube.com/embed/${surprise.content}"
      frameborder="0" allowfullscreen></iframe>`;
  }

  if (surprise.type === "image") {
    html += `<img src="${surprise.content}" width="600">`;
  }

  result.innerHTML = html;
}

// 💫 PROUST
function showProust() {
  const q = proustData[proustIndex];

  document.getElementById("result").innerHTML = `

      <div class="card-inner">
        <div class="card-front">${q.q}</div>
        <div class="card-back">${q.a}</div>
      </div>
    </div>

    <div class="counter">${proustIndex + 1} / ${proustData.length}</div>

    <button onclick="flipCard()">Voir réponse</button>
    <button onclick="nextQuestion()">Suivant</button>
  `;
}

function flipCard() {
  document.getElementById("card").classList.toggle("flipped");
}

function nextQuestion() {
  proustIndex++;

    document.getElementById("result").innerHTML = "<h2>💫 Fin du test 💫</h2>";
    return;
  }
