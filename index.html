/* INPUT */
input {
  padding: 12px;
  width: 60%;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* BUTTON */
button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #ff6b6b;
  color: white;
  cursor: pointer;
  margin: 5px;
  transition: 0.2s;
}

button:hover {
  background: #ff4b4b;
  transform: scale(1.05);
}

#result {
  margin-top: 30px;
}

/* 💫 CARD */
.card {
  perspective: 1000px;
  margin: 20px auto;
  width: 100%;
  max-width: 500px;
  height: 240px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

/* FACES */
.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 20px;
  padding: 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* QUESTION */
.card-front {
  background: white;
  color: #2765F5;
}

/* RÉPONSE (✨ dégradé + glow) */
.card-back {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: #333;
  transform: rotateY(180deg);
  box-shadow: 0 0 20px rgba(255,150,150,0.6);
}

/* LABEL */
.label {
  position: absolute;
  top: 10px;
  left: 15px;
  font-size: 12px;
  opacity: 0.6;
}

/* TEXTE */
.text {
  font-size: 18px;
  text-align: center;
}

/* compteur */
.counter {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.6;
}

/* ✨ animation typing */
.typing {
  border-right: 2px solid #333;
  white-space: nowrap;
  overflow: hidden;
}
</style>

function checkCode() {
  const code = document.getElementById("codeInput").value.toUpperCase();
  const result = document.getElementById("result");

  if (!surprises[code]) {
    result.innerHTML = "❌ Code inconnu 🤪";
    return;
  }

  const surprise = surprises[code];

  if (surprise.type === "proust") {
    window.proustData = surprise.content;
    window.proustIndex = 0;
    showProust();
    return;
  }

  // 👉 tes autres surprises
  let html = `<h2>${surprise.message}</h2>`;

  if (surprise.type === "youtube") {
    html += `<iframe width="450" height="255"
      src="https://www.youtube.com/embed/${surprise.content}"
      frameborder="0" allowfullscreen></iframe>`;
  }

  if (surprise.type === "image") {
    html += `<img src="${surprise.content}" width="600">`;
  }

  result.innerHTML = html;
}

/* 💫 PROUST */
function showProust() {
  const q = proustData[proustIndex];

  document.getElementById("result").innerHTML = `
    <div class="card" id="card">
      <div class="card-inner">
        <div class="card-front">
          <div class="label">Question</div>
          <div class="text">${q.q}</div>
        </div>
        <div class="card-back">
          <div class="label">Réponse</div>
          <div class="text" id="answerText"></div>
        </div>
      </div>
    </div>

    <div class="counter">${proustIndex + 1} / ${proustData.length}</div>

    <button onclick="flipCard()">✨ Révéler</button>
    <button onclick="nextQuestion()">Suivant</button>
  `;
}

/* ✨ flip + typing */
function flipCard() {
  document.getElementById("card").classList.toggle("flipped");

  const text = proustData[proustIndex].a;
  const target = document.getElementById("answerText");

  target.innerHTML = "";
  let i = 0;

  function type() {
    if (i < text.length) {
      target.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 25);
    }
  }

  setTimeout(type, 300);
}

function nextQuestion() {
  proustIndex++;

  if (proustIndex >= proustData.length) {
    document.getElementById("result").innerHTML = "<h2>💫 Fin du test 💫</h2>";
    return;
  }

  showProust();
